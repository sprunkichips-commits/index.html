name: Deploy to GitHub Pages

# Собирает приложение и публикует dist на GitHub Pages.
# Требует: Settings → Pages → Source = «GitHub Actions».
# Деплой идёт с ветки main (она разрешена правилом окружения github-pages
# по умолчанию). Чтобы публиковать с другой ветки — добавь её в
# Settings → Environments → github-pages → Deployment branches.

# Автодеплой ОТКЛЮЧЁН: приложение переехало на Cloudflare
# (mmm.sprunkichips.workers.dev), и параллельно обновляющаяся копия на GitHub
# Pages показывала другую версию — было непонятно, какая из них настоящая.
# Запуск остался только вручную, кнопкой «Run workflow», как аварийный вариант.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        # GitHub Pages отдаёт проект из подпапки /index.html/, поэтому база
        # задаётся явно. По умолчанию сборка идёт под корень домена (Cloudflare).
      - run: npm run build
        env:
          VITE_BASE: /index.html/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
