# ===== Cloudflare Worker «Деньги» =====
# Один Worker обслуживает и API (/api/*), и собранный фронтенд из dist/.
# Поэтому CORS не нужен, а initData не ходит между разными доменами.
#
# ВАЖНО: файл попадает в публичный репозиторий — никаких секретов здесь.
# Токен бота задаётся отдельно и хранится в Cloudflare:
#   npx wrangler secret put BOT_TOKEN

name = "dengi"
main = "worker/src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Статика (собранный Vite-фронтенд) ----------
# run_worker_first: /api/* обрабатывает Worker, всё остальное отдаётся файлами.
# not_found_handling: SPA — неизвестные пути возвращают index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------- База данных D1 (пока ОТКЛЮЧЕНА) ----------
# Сейчас деплоится только статика: приложение работает на локальном хранилище,
# как и раньше, а /api/* честно отвечает 503 «база не подключена».
#
# Привязать базу, когда будешь готов запускать бэкенд:
#   1) npx wrangler d1 create dengi-db          -> напечатает database_id
#   2) раскомментировать блок ниже и вставить этот id
#   3) npx wrangler d1 execute dengi-db --remote --file=worker/schema.sql
#   4) npx wrangler secret put BOT_TOKEN
#
# Пока id не существует, wrangler deploy падает с ошибкой привязки —
# именно поэтому блок закомментирован.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "dengi-db"
# database_id = "ВСТАВЬ_СЮДА_ID_ИЗ_ШАГА_1"

[observability]
enabled = true
