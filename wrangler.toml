# ===== Cloudflare Worker «Деньги» =====
# Один Worker обслуживает и API (/api/*), и собранный фронтенд из dist/.
# Поэтому CORS не нужен, а initData не ходит между разными доменами.
#
# ВАЖНО: файл попадает в публичный репозиторий — никаких секретов здесь.
# Токен бота задаётся отдельно и хранится в Cloudflare:
#   npx wrangler secret put BOT_TOKEN

# name обязан совпадать с именем сервиса в Cloudflare (mmm.sprunkichips.workers.dev).
# Пока здесь стояло «dengi», деплой не попадал в существующий воркер, а
# `wrangler deploy` создал бы рядом второй — приложение в бою не обновлялось.
name = "mmm"
main = "worker/src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Открытые настройки ----------
# Имя бота публично (оно видно всем в Telegram) — это НЕ секрет, поэтому лежит
# в конфиге. Держим его именно здесь, а не в панели: `wrangler deploy`
# заменяет переменные воркера тем, что в конфиге, и переменная, добавленная
# только руками в панели, была бы стёрта следующей сборкой.
#
# Обязано быть именем того же бота, чей токен лежит в секрете BOT_TOKEN:
# виджет входа на сайте подписывает данные ключом бота, а сервер проверяет их
# ключом из BOT_TOKEN — при разных ботах подпись не сойдётся.
[vars]
BOT_USERNAME = "UploadShortss_Bot"

# ---------- Статика (собранный Vite-фронтенд) ----------
# run_worker_first = true: КАЖДЫЙ запрос сначала идёт в Worker, и только потом
# он сам отдаёт файлы через биндинг ASSETS (см. app.notFound в src/index.ts).
#
# Почему не список путей вроде ["/api/*"]: слой статики Cloudflare умеет только
# GET/HEAD и на POST отвечает 405 ещё до Worker'а — из-за этого падал перенос
# данных (POST /api/import -> HTTP 405). Локально miniflare маршрутизирует
# иначе, поэтому баг проявлялся только в бою.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ---------- База данных D1 ----------
# Привязка обязана быть объявлена здесь: при деплое конфиг из репозитория
# перезаписывает биндинги воркера, поэтому база, добавленная только в панели,
# была бы стёрта следующей сборкой.
#
# database_id — не секрет, это публичный идентификатор базы внутри аккаунта.
# Доступ к данным даёт не он, а права аккаунта Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "dengi-db"
database_id = "90d7e150-8eac-4542-8083-56116345180d"

[observability]
enabled = true
