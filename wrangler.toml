# ===== Cloudflare Worker «Деньги» =====
# Один Worker обслуживает и API (/api/*), и собранный фронтенд из dist/.
# Поэтому CORS не нужен, а initData не ходит между разными доменами.
#
# ВАЖНО: файл попадает в публичный репозиторий — никаких секретов здесь.
# Токен бота задаётся отдельно и хранится в Cloudflare:
#   npx wrangler secret put BOT_TOKEN

name = "dengi"
main = "worker/src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Статика (собранный Vite-фронтенд) ----------
# run_worker_first: /api/* обрабатывает Worker, всё остальное отдаётся файлами.
# not_found_handling: SPA — неизвестные пути возвращают index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------- База данных D1 ----------
# Привязка обязана быть объявлена здесь: при деплое конфиг из репозитория
# перезаписывает биндинги воркера, поэтому база, добавленная только в панели,
# была бы стёрта следующей сборкой.
#
# database_id — не секрет, это публичный идентификатор базы внутри аккаунта.
# Доступ к данным даёт не он, а права аккаунта Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "dengi-db"
database_id = "90d7e150-8eac-4542-8083-56116345180d"

[observability]
enabled = true
